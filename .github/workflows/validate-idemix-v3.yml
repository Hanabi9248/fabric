name: Validate Idemix V3 upgrade
on:
  push:
    branches: [codex/validate-idemix-v3e]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 04c1d69f905cf50cf27933d7f709d7998fc8b017
          fetch-depth: 4
          persist-credentials: false
      - name: Verify candidate tree
        run: test "$(git rev-parse 'HEAD^{tree}')" = ae1cd34a52d6c5d3cfa4bdffa8377d028510910b
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Check corrected integration test
        run: |
          test -z "$(gofmt -l integration/idemix/idemix_test.go)"
          go vet ./integration/idemix
      - name: Build integration prerequisites
        run: make integration-test-prereqs
      - name: Confirm original factory fails the upgrade
        run: |
          git show 65931aaf4bfd54e3b882db6d7dab2970440e6646:msp/factory.go > msp/factory.go
          trap 'git checkout -- msp/factory.go' EXIT
          set +e
          $(go env GOPATH)/bin/ginkgo -v --no-color --timeout=10m ./integration/idemix > /tmp/idemix-before.log 2>&1
          result=$?
          set -e
          cat /tmp/idemix-before.log
          echo "Original-factory integration exit: $result"
          test "$result" -ne 0
          grep -F 'Version not recognized [4]' /tmp/idemix-before.log
          git checkout -- msp/factory.go
